<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEFY // ADMIN</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-panel {
      max-width: 700px;
      margin: 0 auto;
      padding: var(--space-xl);
    }
    .admin-title {
      font-family: var(--font-mono);
      font-size: var(--font-size-xl);
      color: var(--accent-amber);
      margin-bottom: var(--space-xl);
      letter-spacing: 0.1em;
    }
    .admin-section {
      margin-bottom: var(--space-xl);
      padding: var(--space-lg);
      background: var(--bg-panel);
      border: 1px solid var(--border);
    }
    .admin-section h2 {
      font-family: var(--font-mono);
      font-size: var(--font-size-md);
      color: var(--accent-amber);
      margin-bottom: var(--space-md);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .admin-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-sm) 0;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
    }
    .admin-row:last-child { border-bottom: none; }
    .stage-jump-grid {
      display: grid;
      gap: var(--space-sm);
      margin-top: var(--space-md);
    }
    .stage-jump-btn {
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      text-transform: uppercase;
      color: var(--text-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: var(--space-md);
      cursor: pointer;
      text-align: left;
      transition: border-color var(--transition-fast);
    }
    .stage-jump-btn:hover {
      border-color: var(--accent-amber);
      color: var(--accent-amber);
    }
    .state-dump {
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      color: var(--accent-green);
      background: var(--bg-dark);
      padding: var(--space-md);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid var(--border);
    }
    .admin-actions {
      display: flex;
      gap: var(--space-md);
      flex-wrap: wrap;
      margin-top: var(--space-md);
    }
    .admin-tabs {
      margin-bottom: var(--space-xl);
    }
    .qr-setup-camera {
      height: 45vh;
      flex: none;
    }
    .qr-setup-status {
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      color: var(--text-dim);
      margin-top: var(--space-sm);
    }
    .qr-setup-status.error { color: var(--accent-red); }
    .qr-setup-result {
      font-family: var(--font-mono);
      margin-top: var(--space-md);
      padding-top: var(--space-md);
      border-top: 1px solid var(--border);
    }
    .qr-setup-id {
      font-size: var(--font-size-xl);
      color: var(--accent-amber);
      word-break: break-all;
    }
    .qr-setup-kind {
      font-size: var(--font-size-xs);
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: var(--space-sm);
    }
    .qr-setup-kind.error { color: var(--accent-red); }
    .qr-setup-label {
      font-size: var(--font-size-md);
      color: var(--text-primary);
      margin-top: var(--space-sm);
    }
    .qr-setup-room {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      margin-top: var(--space-xs);
    }
    .qr-setup-raw {
      font-size: var(--font-size-xs);
      color: var(--text-dim);
      margin-top: var(--space-sm);
      word-break: break-all;
    }
    .qr-setup-image {
      display: block;
      max-width: 100%;
      max-height: 240px;
      margin-top: var(--space-md);
    }
    .qr-setup-play {
      width: 100%;
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <div class="admin-panel">
    <h1 class="admin-title">⚙ SEFY ADMIN PANEL</h1>

    <div class="fo-tabs admin-tabs">
      <button class="fo-tab active" data-tab="mission">⚙ Mission</button>
      <button class="fo-tab" data-tab="qr">📷 QR Setup</button>
    </div>

    <div id="admin-tab-mission">
      <!-- Current State -->
      <div class="admin-section">
        <h2>Current State</h2>
        <div id="state-display" class="state-dump">Loading...</div>
        <div class="admin-actions">
          <button id="btn-refresh-state" class="btn btn-outline">Refresh</button>
          <button id="btn-export-state" class="btn btn-outline">Export JSON</button>
        </div>
      </div>

      <!-- Jump to Stage -->
      <div class="admin-section">
        <h2>Jump to Stage</h2>
        <p style="font-family: var(--font-mono); font-size: var(--font-size-xs); color: var(--text-dim); margin-bottom: var(--space-sm);">
          Sets currentStage and redirects to main site.
        </p>
        <div id="stage-jump-grid" class="stage-jump-grid">
          Loading stages...
        </div>
      </div>

      <!-- Danger Zone -->
      <div class="admin-section">
        <h2>Danger Zone</h2>
        <div class="admin-actions">
          <button id="btn-reset-emy" class="btn btn-danger">Reset Émy</button>
          <button id="btn-reset-lea" class="btn btn-danger">Reset Léa</button>
          <button id="btn-reset-all" class="btn btn-danger">Reset All</button>
          <button id="btn-back" class="btn btn-outline">← Back to Mission</button>
        </div>
      </div>
    </div>

    <div id="admin-tab-qr" class="hidden">
      <div class="admin-section">
        <h2>QR Setup</h2>
        <div class="qr-camera-wrap qr-setup-camera">
          <video id="qr-setup-video" autoplay playsinline muted></video>
          <canvas id="qr-setup-canvas" class="hidden"></canvas>
          <div class="qr-crosshair"></div>
        </div>
        <div id="qr-setup-status" class="qr-setup-status"></div>
        <div id="qr-setup-result" class="qr-setup-result hidden">
          <div id="qr-setup-id" class="qr-setup-id"></div>
          <div id="qr-setup-kind" class="qr-setup-kind"></div>
          <div id="qr-setup-label" class="qr-setup-label"></div>
          <div id="qr-setup-room" class="qr-setup-room"></div>
          <div id="qr-setup-raw" class="qr-setup-raw"></div>
          <img id="qr-setup-image" class="qr-setup-image hidden" alt="">
          <button id="qr-setup-play" class="btn btn-primary qr-setup-play hidden">▶ Play</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
